<title>the low door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #e8e1d1;
    --ink-2: #a9a399;
    --ink-3: #5e5a55;
    --blood: #c8182f;
    --foil: #b9b2a2;
    --line: rgba(232,225,209,.16);
    --line-soft: rgba(232,225,209,.07);
    --display: 'Cinzel', 'Times New Roman', serif;
    --body: 'Spectral', Georgia, serif;
  }
  html, body { margin: 0; height: 100%; padding: 0; background: #0b0d0a; overflow: hidden; font-family: var(--body); color: var(--ink); }
  html { font-size: calc(100vh / 108); }
  canvas { display: block; }

  .plate {
    position: fixed; left: max(2.6rem, env(safe-area-inset-left, 0px)); bottom: max(2.6rem, env(safe-area-inset-bottom, 0px)); width: 36rem; max-width: calc(100vw - 5.2rem);
    background: rgba(8,8,10,.82); border: 1px solid var(--line);
    padding: 1.9rem 2.2rem 2rem;
    opacity: 0; transform: translateY(1rem);
    transition: opacity .3s ease-out, transform .3s ease-out;
  }
  .plate::before { content: ''; position: absolute; inset: .55rem; border: 1px solid var(--line-soft); pointer-events: none; }
  .plate.on { opacity: 1; transform: none; }

  .eyebrow { font-family: var(--display); font-size: 1.05rem; letter-spacing: .26em; text-transform: uppercase; color: var(--foil); display: flex; justify-content: space-between; }
  .eyebrow span:last-child { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .mood { font-family: var(--display); font-weight: 400; font-size: 2.3rem; letter-spacing: .2em; text-transform: uppercase; margin-top: .7rem; color: var(--blood); }
  .say { font-family: var(--body); font-style: italic; font-weight: 300; font-size: 1.95rem; line-height: 1.3; margin-top: .9rem; min-height: 2.4rem; color: var(--ink); }
  .did { font-size: 1.3rem; color: var(--ink-3); margin-top: .4rem; }

  .needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
  .need label { display: block; font-family: var(--display); font-size: .95rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  .need .val { font-family: var(--body); font-weight: 600; font-size: 1.7rem; font-variant-numeric: tabular-nums; margin-top: .15rem; color: var(--ink); }
  .need .bar { height: 1px; background: var(--line); margin-top: .55rem; overflow: hidden; }
  .need .bar i { display: block; height: 100%; width: 0; background: var(--foil); transition: width .4s ease-out; }
  .need.warn .bar i { background: var(--blood); }
  .need.warn .val { color: var(--blood); }

  .diary { position: fixed; right: 2.6rem; bottom: 2.6rem; width: 32rem; max-width: calc(100vw - 5.2rem); font-size: 1.3rem; font-style: italic; font-weight: 300; color: var(--ink-3); line-height: 1.5; text-align: right; pointer-events: none; }
  .diary div { opacity: .55; }
  .diary div:last-child { opacity: 1; color: var(--ink-2); }

  .corner { position: fixed; top: 2.2rem; left: 2.6rem; font-family: var(--display); font-size: 1.05rem; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
  .corner b { color: var(--foil); font-weight: 400; }

  @media (max-width: 700px) { .diary { display: none; } .plate { width: auto; right: 2.6rem; } }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
// the cat. low-poly, built from code, posed by blending.
// makeCat() returns { group, setPose(name), update(dt, now, mood) }
// the group faces +x. turn it with group.rotation.y.



const BLACK = 0x15151a;
const INNER_EAR = 0x5a3340;
const EYE = 0xd4c24f;
const PUPIL = 0x0a0a0a;
const NOSE = 0x3a2a30;

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.02, flatShading: true, ...extra });

const lerp = (a, b, t) => a + (b - a) * t;

function makeCat() {
  const fur = mat(BLACK);
  const group = new THREE.Group();

  // ----- torso: a lathe, nose to tail, so it tapers like a cat and not a bean
  const torsoPts = [];
  const prof = [
    [0.0, 0.0], [0.06, 0.15], [0.14, 0.2], [0.26, 0.22], [0.4, 0.215], [0.54, 0.21], [0.64, 0.22], [0.74, 0.23], [0.82, 0.2], [0.87, 0.11], [0.88, 0.0],
  ];
  for (const [x, r] of prof) torsoPts.push(new THREE.Vector2(r, x));
  const torsoGeo = new THREE.LatheGeometry(torsoPts, 12);
  torsoGeo.rotateZ(-Math.PI / 2); // lathe axis y -> x
  torsoGeo.translate(-0.44, 0, 0);
  torsoGeo.scale(1, 0.9, 1);
  const torso = new THREE.Mesh(torsoGeo, fur);
  torso.castShadow = true;
  const torsoPivot = new THREE.Group();
  torsoPivot.add(torso);
  torsoPivot.position.y = 0.42;
  group.add(torsoPivot);

  // haunches, a little wider than the torso at the back
  const haunchGeo = new THREE.SphereGeometry(0.22, 10, 8);
  haunchGeo.scale(0.9, 0.95, 1.2);
  const haunch = new THREE.Mesh(haunchGeo, fur);
  haunch.position.set(-0.34, -0.02, 0);
  haunch.castShadow = true;
  torsoPivot.add(haunch);

  // ----- legs: thigh + shin as one tapered cylinder, paw as a squashed sphere
  const legs = {};
  const legGeo = new THREE.CylinderGeometry(0.05, 0.07, 0.44, 7);
  legGeo.translate(0, -0.22, 0);
  const pawGeo = new THREE.SphereGeometry(0.085, 8, 6);
  pawGeo.scale(1.2, 0.55, 1);
  for (const [name, x, z] of [['fl', 0.26, -0.12], ['fr', 0.26, 0.12], ['bl', -0.32, -0.14], ['br', -0.32, 0.14]]) {
    const hip = new THREE.Group();
    hip.position.set(x, -0.02, z);
    const leg = new THREE.Mesh(legGeo, fur);
    leg.castShadow = true;
    const paw = new THREE.Mesh(pawGeo, fur);
    paw.position.set(0.03, -0.44, 0);
    paw.castShadow = true;
    hip.add(leg, paw);
    torsoPivot.add(hip);
    legs[name] = hip;
  }

  // ----- head on a neck pivot
  const neck = new THREE.Group();
  neck.position.set(0.42, 0.1, 0);
  torsoPivot.add(neck);
  const headGeo = new THREE.SphereGeometry(0.22, 10, 8);
  headGeo.scale(1.0, 0.92, 1.05);
  const head = new THREE.Mesh(headGeo, fur);
  head.castShadow = true;
  const headPivot = new THREE.Group();
  headPivot.position.set(0.1, 0.1, 0);
  headPivot.add(head);
  neck.add(headPivot);
  // muzzle
  const muzzleGeo = new THREE.SphereGeometry(0.12, 8, 6);
  muzzleGeo.scale(1.1, 0.7, 1.1);
  const muzzle = new THREE.Mesh(muzzleGeo, fur);
  muzzle.position.set(0.17, -0.06, 0);
  headPivot.add(muzzle);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.04, 4), mat(NOSE, { roughness: 0.5 }));
  nose.rotation.z = -Math.PI / 2;
  nose.position.set(0.3, -0.03, 0);
  headPivot.add(nose);
  // ears: a thin triangular prism with a pink inner face
  const earShape = new THREE.Shape();
  earShape.moveTo(-0.07, 0);
  earShape.lineTo(0.07, 0);
  earShape.lineTo(0.0, 0.2);
  earShape.lineTo(-0.07, 0);
  const earGeo = new THREE.ExtrudeGeometry(earShape, { depth: 0.035, bevelEnabled: false });
  earGeo.rotateY(Math.PI / 2); // flat face points along x
  const earInnerGeo = new THREE.ShapeGeometry(earShape);
  earInnerGeo.scale(0.6, 0.6, 1);
  earInnerGeo.rotateY(Math.PI / 2);
  const ears = [];
  for (const side of [-1, 1]) {
    const ear = new THREE.Mesh(earGeo, fur);
    ear.castShadow = true;
    ear.position.set(0.04, 0.17, side * 0.11);
    ear.rotation.x = side * -0.35;
    ear.rotation.z = 0.15;
    const inner = new THREE.Mesh(earInnerGeo, mat(INNER_EAR, { roughness: 0.9 }));
    inner.position.set(0.02, 0.02, 0);
    ear.add(inner);
    headPivot.add(ear);
    ears.push(ear);
  }
  // eyes: a yellow disc with a slit
  const eyes = [];
  const pupils = [];
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshBasicMaterial({ color: EYE }));
    eye.position.set(0.17, 0.04, side * 0.085);
    eye.scale.set(0.6, 1, 1);
    const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.06, 0.012), new THREE.MeshBasicMaterial({ color: PUPIL }));
    pupil.position.set(0.045, 0, 0);
    eye.add(pupil);
    headPivot.add(eye);
    eyes.push(eye);
    pupils.push(pupil);
  }
  // whiskers: three thin lines each side
  const whiskerMat = new THREE.LineBasicMaterial({ color: 0x55555c, transparent: true, opacity: 0.7 });
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0.24, -0.05 + i * 0.015, side * 0.08), new THREE.Vector3(0.3, -0.1 + i * 0.045, side * 0.26)]);
      headPivot.add(new THREE.Line(g, whiskerMat));
    }
  }

  // ----- tail: a tube along a curve we rewrite every frame
  const tailPts = Array.from({ length: 6 }, () => new THREE.Vector3());
  const tailCurve = new THREE.CatmullRomCurve3(tailPts);
  let tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 16, 0.045, 6, false), fur);
  tail.castShadow = true;
  torsoPivot.add(tail);
  const tailTip = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), fur);
  torsoPivot.add(tailTip);

  // ----- poses: every number the animation blends between
  const POSES = {
    stand: { torsoY: 0.46, torsoRot: 0, torsoSY: 1, haunchY: -0.04, neckRot: 0, headRot: 0, headY: 0.1, legs: [0, 0, 0, 0], legLen: 1, eyes: 1, earRot: 0.15, tailBase: 0.5, tailCurl: 0.6, tailSide: 0 },
    sit: { torsoY: 0.44, torsoRot: -0.5, torsoSY: 1, haunchY: 0.02, neckRot: 0.5, headRot: 0.05, headY: 0.1, legs: [0.5, 0.5, -1.3, -1.3], legLen: 1, eyes: 1, earRot: 0.15, tailBase: 0.2, tailCurl: 0.3, tailSide: 0.9 },
    walk: { torsoY: 0.48, torsoRot: 0, torsoSY: 1, haunchY: -0.04, neckRot: -0.05, headRot: 0.05, headY: 0.1, legs: [0, 0, 0, 0], legLen: 1, eyes: 1, earRot: 0.15, tailBase: 0.9, tailCurl: 0.2, tailSide: 0 },
    read: { torsoY: 0.44, torsoRot: -0.5, torsoSY: 1, haunchY: 0.02, neckRot: 0.75, headRot: 0.45, headY: 0.05, legs: [0.5, 0.5, -1.3, -1.3], legLen: 1, eyes: 1, earRot: 0.3, tailBase: 0.2, tailCurl: 0.3, tailSide: 0.9 },
    eat: { torsoY: 0.46, torsoRot: 0.15, torsoSY: 1, haunchY: -0.04, neckRot: 0.9, headRot: 0.55, headY: 0.05, legs: [0.1, 0.1, 0, 0], legLen: 1, eyes: 0.4, earRot: 0.45, tailBase: 0.4, tailCurl: 0.5, tailSide: 0 },
    look: { torsoY: 0.44, torsoRot: -0.35, torsoSY: 1, haunchY: 0, neckRot: -0.55, headRot: -0.25, headY: 0.12, legs: [0.3, 0.3, -1.1, -1.1], legLen: 1, eyes: 1, earRot: 0.05, tailBase: 0.3, tailCurl: 0.4, tailSide: 0.6 },
    sleep: { torsoY: 0.26, torsoRot: 0.05, torsoSY: 0.75, haunchY: -0.02, neckRot: 0.95, headRot: 0.35, headY: -0.02, legs: [1.2, 1.2, -1.5, -1.5], legLen: 0.6, eyes: 0, earRot: -0.2, tailBase: -0.3, tailCurl: 1.4, tailSide: 1.6 },
  };

  const cur = JSON.parse(JSON.stringify(POSES.stand));
  let target = POSES.stand;
  let poseName = 'stand';
  let walkPhase = 0;
  let blink = 0;

  function setPose(name) {
    if (POSES[name]) {
      target = POSES[name];
      poseName = name;
    }
  }

  function update(dt, now, mood = 'content', moving = false) {
    const k = 1 - Math.pow(0.001, dt); // frame-rate independent ease, ~fast
    for (const key of Object.keys(target)) {
      if (key === 'legs') for (let i = 0; i < 4; i++) cur.legs[i] = lerp(cur.legs[i], target.legs[i], k * 0.7);
      else cur[key] = lerp(cur[key], target[key], k * 0.7);
    }

    // breathing
    const breath = Math.sin(now * (poseName === 'sleep' ? 1.1 : 2.2)) * (poseName === 'sleep' ? 0.015 : 0.008);
    torsoPivot.position.y = cur.torsoY + breath;
    torsoPivot.rotation.z = cur.torsoRot;
    torso.scale.y = cur.torsoSY + breath;
    haunch.position.y = cur.haunchY;

    // walk cycle on the legs
    if (moving) walkPhase += dt * 9;
    const legOrder = ['fl', 'fr', 'bl', 'br'];
    legOrder.forEach((n, i) => {
      const swing = moving ? Math.sin(walkPhase + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.55 : 0;
      legs[n].rotation.z = cur.legs[i] + swing;
      legs[n].scale.y = cur.legLen;
    });

    // head
    neck.rotation.z = -cur.neckRot;
    headPivot.rotation.z = -cur.headRot + (poseName === 'read' ? Math.sin(now * 1.4) * 0.03 : 0) + (poseName === 'eat' ? Math.abs(Math.sin(now * 6)) * 0.12 : 0);
    headPivot.position.y = cur.headY;
    // a look around now and then when idle
    const glance = poseName === 'sit' || poseName === 'stand' ? Math.sin(now * 0.37) * Math.sin(now * 0.11) * 0.5 : 0;
    headPivot.rotation.y = glance;
    ears.forEach((e, i) => {
      e.rotation.z = cur.earRot + (mood === 'restless' || mood === 'feral' ? Math.sin(now * 7 + i * 2) * 0.08 : 0);
      e.rotation.x = (i === 0 ? -1 : 1) * -(0.35 + (mood === 'bleak' ? 0.5 : 0)); // flat back when bleak
    });

    // eyes and blink
    blink -= dt;
    if (blink < -3 - Math.random() * 4) blink = 0.14;
    const open = cur.eyes * (blink > 0 ? 0.08 : 1) * (mood === 'smug' || mood === 'bleak' ? 0.55 : 1);
    eyes.forEach((e) => (e.scale.y = Math.max(0.02, open)));
    pupils.forEach((p) => (p.scale.y = mood === 'feral' || mood === 'restless' ? 1.6 : 1));

    // tail: rebuild the curve
    const sway = mood === 'feral' || mood === 'restless' ? 1.4 : mood === 'bleak' ? 0.15 : mood === 'asleep' ? 0.1 : 0.55;
    const base = new THREE.Vector3(-0.5, cur.haunchY + 0.1, 0);
    for (let i = 0; i < tailPts.length; i++) {
      const t = i / (tailPts.length - 1);
      const wag = Math.sin(now * 2.1 + t * 3) * 0.14 * sway * t;
      tailPts[i].set(
        base.x - t * 0.5 * (1 - cur.tailSide * 0.5) + Math.sin(t * Math.PI) * cur.tailCurl * -0.25,
        base.y + Math.sin(t * Math.PI * 0.9) * cur.tailBase * 0.5 + t * (cur.tailBase > 0.6 ? 0.25 : -0.05) + Math.sin(now * 1.6 + t * 2) * 0.03 * sway,
        wag + t * cur.tailSide * 0.45
      );
    }
    tailCurve.points = tailPts;
    tail.geometry.dispose();
    tail.geometry = new THREE.TubeGeometry(tailCurve, 16, 0.045, 6, false);
    tailTip.position.copy(tailPts[tailPts.length - 1]);
  }

  return { group, setPose, update, poses: Object.keys(POSES) };
}

// the room. style c: dusty gothic. everything here is built from code, no model files.
// it listens to /events for the cat's state and moves him accordingly.
// with no server (or ?demo) it plays a scripted evening so the room can be looked at on its own.

import * as THREE from 'three';


// ---------- palette ----------
const P = {
  bg: 0x0b0d0a,
  wallBack: 0x2a3326,
  wallSide: 0x3a4433,
  plankA: 0x4a3a28,
  plankB: 0x3f3122,
  wood: 0x5a4530,
  woodDark: 0x3a2b1c,
  shelf: 0x5a4a30,
  paper: 0xd9d0a8,
  paperDark: 0xb8ad88,
  candle: 0xe0a040,
  flame: 0xf4e0a0,
  moon: 0x9fb0c8,
  cat: 0x16161a,
  eye: 0xc9b84a,
  rug: 0x5a2a2a,
  rugLine: 0x7a4a3a,
  cushion: 0x3a2a2a,
  glass: 0x1a1c2a,
  iron: 0x2a2416,
  tin: 0x3a3a30,
  crystal: 0x9fd8c8,
  jars: [0x5a6a4a, 0x7a5a3a, 0x6a4a5a, 0x4a5a6a, 0x8a7a4a, 0x4a6a5a],
};

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0.02, flatShading: true, ...extra });

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(P.bg);
scene.fog = new THREE.Fog(P.bg, 14, 26);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 60);
camera.position.set(9.5, 7.6, 10.5);
camera.lookAt(-0.3, 1.4, -0.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.prepend(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// room: x from -4 to 4, z from -3 to 3, y from 0 to 5. back wall at z=-3, left wall at x=-4.
const W = 8, D = 6, H = 5;

function box(w, h, d, m, x, y, z, { shadow = true, receive = true } = {}) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z);
  g.castShadow = shadow;
  g.receiveShadow = receive;
  scene.add(g);
  return g;
}

// ---------- walls and floor ----------
const back = box(W, H, 0.3, mat(P.wallBack), 0, H / 2, -D / 2 - 0.15, { shadow: false });
const left = box(0.3, H, D, mat(P.wallSide), -W / 2 - 0.15, H / 2, 0, { shadow: false });
// floor planks running along x
for (let i = 0; i < 12; i++) {
  const z = -D / 2 + 0.25 + i * 0.5;
  box(W, 0.12, 0.48, mat(i % 2 ? P.plankA : P.plankB), 0, -0.06, z, { shadow: false });
}
// skirting
box(W, 0.3, 0.12, mat(P.woodDark), 0, 0.15, -D / 2 + 0.06, { shadow: false });
box(0.12, 0.3, D, mat(P.woodDark), -W / 2 + 0.06, 0.15, 0, { shadow: false });
// a beam across the ceiling line, suggests the rest of the building
box(W, 0.3, 0.3, mat(P.woodDark), 0, H - 0.15, -D / 2 + 0.15, { shadow: false });
box(0.3, 0.3, D, mat(P.woodDark), -W / 2 + 0.15, H - 0.15, 0, { shadow: false });

// ---------- arched window on the left wall ----------
{
  const frame = new THREE.Group();
  const shape = new THREE.Shape();
  const w = 1.6, h = 2.6, r = w / 2;
  shape.moveTo(-w / 2, 0);
  shape.lineTo(-w / 2, h - r);
  shape.absarc(0, h - r, r, Math.PI, 0, true);
  shape.lineTo(w / 2, 0);
  shape.lineTo(-w / 2, 0);
  const glass = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), new THREE.MeshStandardMaterial({ color: P.glass, emissive: 0x141a2e, emissiveIntensity: 0.9, roughness: 1 }));
  glass.rotation.y = Math.PI / 2;
  glass.position.set(-W / 2 + 0.02, 1.4, -0.9);
  frame.add(glass);
  // iron frame: a sill, two uprights, a cross bar, a centre bar
  const iron = mat(P.iron);
  const sill = box(0.5, 0.12, w + 0.5, mat(P.woodDark), -W / 2 + 0.2, 1.36, -0.9);
  const upL = box(0.08, h - r, 0.08, iron, -W / 2 + 0.06, 1.4 + (h - r) / 2, -0.9 - w / 2);
  const upR = box(0.08, h - r, 0.08, iron, -W / 2 + 0.06, 1.4 + (h - r) / 2, -0.9 + w / 2);
  const cross = box(0.08, 0.08, w, iron, -W / 2 + 0.06, 2.6, -0.9);
  const centre = box(0.08, h, 0.08, iron, -W / 2 + 0.06, 1.4 + h / 2, -0.9);
  const arch = new THREE.Mesh(new THREE.TorusGeometry(r, 0.045, 6, 24, Math.PI), iron);
  arch.rotation.y = Math.PI / 2;
  arch.position.set(-W / 2 + 0.06, 1.4 + h - r, -0.9);

  eat: 'bowl',

  'tend stock': 'shelves',

// ---------- state and animation ----------
const S = {
  action: 'nothing',
  target: SPOT.middle,
  from: { ...SPOT.middle },
  t: 1,
  asleep: false,
  mood: 'content',
  castAt: 0,
  candlesLit: 2,
  offerings: 0,
  face: 1,
};

function goTo(spot) {
  S.from = { x: cat.position.x, y: cat.position.y, z: cat.position.z };
  S.target = spot;
  S.t = 0;
}

export function applyState(st) {
  const action = st.asleep ? 'sleep' : st.action || 'nothing';
  if (action !== S.action || st.asleep !== S.asleep) {
    S.action = action;
    goTo(SPOT[WHERE[action]] || SPOT.middle);
    if (action === 'cast') S.castAt = performance.now();
  }
  S.asleep = !!st.asleep;
  S.mood = st.mood;
  S.candlesLit = st.candles ? st.candles.lit : 2;
  S.offerings = st.offerings || 0;
  // the room
  bowlFood.visible = st.bowl > 0;
  const visibleJars = Math.min(jars.length, Math.max(2, Math.round((st.stock || 0) * 3)));
  jars.forEach((j, i) => {
    j.jar.visible = i < visibleJars || i % 3 !== 0;
    j.lid.visible = j.jar.visible;
  });
  candles.forEach((c, i) => {
    const lit = i < S.candlesLit;
    c.flame.visible = lit;
    c.glow.visible = lit;
    c.light.intensity = lit ? c.base : 0;
  });
  crystal.visible = S.offerings > 0;
  crystalLight.intensity = S.offerings > 0 ? 1.4 : 0;
  // the plate
  plate(st);
}

// ---------- the plate ----------
const $ = (id) => document.getElementById(id);
function plate(st) {
  $('plate').classList.add('on');
  $('moon').textContent = 'moon ' + (st.moon || '');
  $('time').textContent = st.time || '';
  $('mood').textContent = st.asleep ? 'asleep' : st.mood || '';
  $('say').textContent = st.say || (st.asleep ? '' : '');
  $('did').textContent = st.asleep ? 'the book is being rewritten' : st.event || '';
  for (const k of ['hunger', 'sleep', 'purpose']) {
    const v = st.needs ? st.needs[k] : 0;
    const el = $('n-' + k);
    el.querySelector('.val').textContent = v;
    el.querySelector('.bar i').style.width = v + '%';
    el.classList.toggle('warn', k === 'purpose' ? v < 30 : v > 70);
  }
  const d = $('diary');
  d.innerHTML = '';
  for (const line of (st.diary || []).slice(-4)) {
    const div = document.createElement('div');
    div.textContent = line;
    d.appendChild(div);
  }
}

// ---------- frame ----------
const params = new URLSearchParams(location.search);
const CLOSE = params.has('close'); // a close camera on the cat, for checking him
const clock = new THREE.Clock();
const ease = (t) => 1 - Math.pow(1 - t, 3);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now() / 1000;

  // walking
  if (S.t < 1) {
    S.t = Math.min(1, S.t + dt / 1.6);
    const e = ease(S.t);
    cat.position.x = S.from.x + (S.target.x - S.from.x) * e;
    cat.position.z = S.from.z + (S.target.z - S.from.z) * e;
    const hop = Math.sin(S.t * Math.PI * 4) * 0.06 * (1 - S.t);
    cat.position.y = S.from.y + (S.target.y - S.from.y) * e + Math.max(0, hop) + (S.target.y > S.from.y + 0.5 ? Math.sin(S.t * Math.PI) * 0.7 : 0);
    const dx = S.target.x - S.from.x;
    if (Math.abs(dx) > 0.1) S.face = dx > 0 ? 1 : -1;
  } else {
    S.face = S.target.face;
  }
  const want = S.face > 0 ? 0 : Math.PI;
  let diff = want - cat.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  cat.rotation.y += diff * Math.min(1, dt * 6);

  // pose
  const moving = S.t < 1;
  const a = S.action;
  let pose = 'sit';
  if (S.asleep || a === 'sleep') pose = 'sleep';
  else if (moving) pose = 'walk';
  else if (a === 'read' || a === 'write' || a === 'count the till') pose = 'read';
  else if (a === 'eat') pose = 'eat';
  else if (a === 'look out the window' || a === 'check the mirror' || a === 'find the offering') pose = 'look';
  else if (a === 'tend stock' || a === 'light candle' || a === 'cast') pose = 'stand';
  soot.setPose(pose);
  soot.update(dt, now, S.asleep ? 'asleep' : S.mood, moving);

  // candles flicker
  candles.forEach((c, i) => {
    if (c.light.intensity === 0) return;
    const f = 1 + Math.sin(now * 13 + i * 7) * 0.08 + Math.sin(now * 29 + i * 3) * 0.05;
    const burst = a === 'cast' && now * 1000 - S.castAt < 1500 ? 1 + Math.sin((now * 1000 - S.castAt) / 1500 * Math.PI) * 1.8 : 1;
    c.light.intensity = c.base * f * burst;
    c.flame.scale.setScalar(f * (burst > 1 ? 1 + (burst - 1) * 0.6 : 1));
    c.glow.material.opacity = 0.3 * f * burst;
  });

  // crystal
  if (crystal.visible) {
    crystal.rotation.y += dt * 0.8;
    crystal.position.y = 0.25 + Math.sin(now * 2) * 0.04;
    crystalLight.intensity = 1.2 + Math.sin(now * 3) * 0.3;
  }

  if (CLOSE) {
    camera.position.set(cat.position.x + 2.6, cat.position.y + 1.7, cat.position.z + 2.4);
    camera.lookAt(cat.position.x, cat.position.y + 0.45, cat.position.z);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// ---------- feed ----------
let gotState = false;

function connect() {
  try {
    const es = new EventSource('/events');
    es.onmessage = (e) => {
      gotState = true;
      $('brain').textContent = 'live';
      applyState(JSON.parse(e.data));
    };
    es.onerror = () => {
      if (!gotState) startDemo();
    };
  } catch {
    startDemo();
  }
}

// a scripted evening, for looking at the room with no server behind it
function startDemo() {
  if (window.__demo) return;
  window.__demo = true;
  $('brain').textContent = 'demo';
  const script = [
    ['look out the window', 'content', 'moon is going. good. the last one was too interested.', 'looked out. moon waning crescent'],
    ['read', 'content', 'page forty. the one about doors. still wants a key.', 'read about the door spell'],
    ['count the till', 'anxious', 'nine. it was nine yesterday. that is not a trend, that is a fact.', 'counted the till. 9'],
    ['nothing', 'content', 'sat.', 'sat'],
    ['tend stock', 'content', 'herbs into jars. the rosemary is giving up but so am i.', 'made 2 jars from the herbs. 4 herbs left'],
    ['cast', 'content', 'said the words. waited.', 'cast the rosemary spell. it failed. a jar broke. 4 jars left'],
    ['check the mirror', 'bleak', 'mirror. no.', 'checked the mirror'],
    ['find the offering', 'restless', 'something at the door. reading it.', 'read what tio left: "is the door spell a rosemary spell or not"'],
    ['write', 'content', 'wrote small. rule five.', 'wrote: the door spell is a rosemary spell. now the rosemary is on the floor'],
    ['eat', 'content', 'dinner was stock. the ledger will not like that but the ledger is not hungry.', 'ate a jar of stock. 3 jars left'],
    ['sleep', 'restless', 'going to sleep on this and the book, in that order.', 'went to sleep'],
  ];
  let i = 0;
  let needs = { hunger: 40, sleep: 35, purpose: 55 };
  let diary = ['21:40  read what tio left. tio is someone now'];
  const tick = () => {
    const [action, mood, say, event] = script[i % script.length];
    const asleep = action === 'sleep' && i % script.length === script.length - 1;
    needs = {
      hunger: Math.min(95, needs.hunger + (action === 'eat' ? -40 : 6)),
      sleep: Math.min(95, needs.sleep + (action === 'sleep' ? -60 : 5)),
      purpose: Math.max(5, Math.min(95, needs.purpose + (action === 'cast' ? -8 : action === 'read' ? 6 : -2))),
    };
    if (/broke|read what|wrote/.test(event)) diary.push(`${21 + Math.floor(i / 6)}:${String(40 + (i * 7) % 20).padStart(2, '0')}  ${event}`);
    applyState({
      time: `${21 + Math.floor(i / 6)}:${String(40 + (i * 7) % 20).padStart(2, '0')}`,
      moon: 'waning crescent',
      mood,
      asleep,
      needs,
      money: 9,
      stock: action === 'tend stock' ? 5 : 3,
      bowl: action === 'eat' ? 0 : 1,
      candles: { lit: action === 'cast' && i % 2 ? 1 : 2, total: 2 },
      offerings: i % script.length >= 5 && i % script.length < 7 ? 1 : 0,
      action,
      say,
      event,
      diary: diary.slice(-4),
    });
    i++;
    setTimeout(tick, asleep ? 7000 : 4200);
  };
  tick();
}

if (true) startDemo();
else {
  connect();
  setTimeout(() => {
    if (!gotState) startDemo();
  }, 3000);
}
