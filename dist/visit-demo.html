<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the low door · visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-accent: #e0a040;
    --accent-glow: rgba(224,160,64,.30);
    --accent-dim: rgba(224,160,64,.12);
    --orange: #c9553d;
    --bg-page: #0b0d0a;
    --bg-outer: rgba(10,10,12,.94);
    --bg-mid: rgba(22,22,26,.85);
    --bg-card: rgba(34,34,40,.7);
    --text-1: #f1ece0;
    --text-2: #b8b0a0;
    --text-3: #7d7868;
    --success: #6fbf8a;
    --danger: #ff4444;
    --line: rgba(255,255,255,.10);
    --line-soft: rgba(255,255,255,.06);
    --radius-panel: 14px;
    --radius-card: 8px;
    --ease-out: cubic-bezier(0.22,1,0.36,1);
    --paper: #d9d0a8;
    --ink: #3a2e1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-page); color: var(--text-1); font-family: 'Rajdhani', 'Segoe UI', sans-serif; }
  body { min-height: 100vh; padding: 28px 16px 48px; background-image: radial-gradient(ellipse at 30% 0%, rgba(224,160,64,.06), transparent 55%); }

  .wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  .panel { position: relative; background: var(--bg-outer); border: 1px solid var(--line); border-radius: var(--radius-panel); box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 36px var(--accent-dim); overflow: hidden; animation: rise .2s var(--ease-out); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
  .panel::before, .panel::after { content: ''; position: absolute; width: 22px; height: 22px; border-color: var(--panel-accent); border-style: solid; z-index: 2; pointer-events: none; }
  .panel::before { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .panel::after { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .head { position: relative; padding: 22px 26px 18px; border-bottom: 3px solid; border-image: linear-gradient(90deg, var(--panel-accent), transparent) 1; background: linear-gradient(180deg, rgba(40,40,48,.6), rgba(10,10,12,0)); }
  .head::before { content: ''; position: absolute; inset: 0; background: var(--panel-accent); opacity: .13; z-index: -1; mix-blend-mode: screen; }
  .eyebrow { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--panel-accent); }
  .eyebrow.dim { color: var(--text-3); }
  h1 { margin: 6px 0 0; font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 0 26px var(--accent-glow); }
  .body { padding: 22px 26px 26px; display: grid; gap: 24px; }

  .section { display: grid; gap: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; font-weight: 600; color: var(--text-2); }
  .row b { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .row b.accent { color: var(--panel-accent); }
  .hint { font-size: 13px; font-weight: 500; letter-spacing: .02em; color: var(--text-3); line-height: 1.5; }
  .say { font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--text-1); }

  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  input, textarea { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: var(--radius-card); color: var(--text-1); font: 600 16px 'Rajdhani', sans-serif; padding: 11px 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
  input:focus, textarea:focus { border-color: var(--panel-accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input::placeholder, textarea::placeholder { color: var(--text-3); font-weight: 500; }
  .count { text-align: right; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-top: 4px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-card); padding: 12px 18px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; transition: transform .15s var(--ease-out), box-shadow .15s, opacity .15s; }
  .btn.primary { background: linear-gradient(90deg, var(--panel-accent), var(--orange)); color: #1a1208; width: 100%; }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
  .btn.primary:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text-2); padding: 8px 12px; font-size: 10px; }
  .btn.ghost:hover { border-color: var(--panel-accent); color: var(--text-1); }
  .btn:focus-visible { outline: 2px solid var(--panel-accent); outline-offset: 2px; }

  .done { display: none; padding: 14px 16px; border: 1px solid rgba(111,191,138,.35); border-left: 3px solid var(--success); border-radius: 0 var(--radius-card) var(--radius-card) 0; background: rgba(111,191,138,.08); font-size: 15px; font-weight: 600; line-height: 1.45; }
  .done.on { display: block; animation: rise .2s var(--ease-out); }
  .err { display: none; color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .err.on { display: block; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-soft); padding: 0 26px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 14px 12px 12px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); cursor: pointer; margin-bottom: -1px; }
  .tab:hover { color: var(--text-2); }
  .tab.on { color: var(--panel-accent); border-bottom-color: var(--panel-accent); }
  .tab:focus-visible { outline: 2px solid var(--panel-accent); outline-offset: -2px; }

  .page { margin: 22px 26px 26px; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 30px 34px 36px; min-height: 420px; box-shadow: inset 0 0 60px rgba(90,60,20,.18), 0 10px 30px rgba(0,0,0,.5); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 17px; line-height: 1.6; animation: rise .22s var(--ease-out); background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(90,60,20,.07) 31px 32px); }
  .page h2 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #7a5a30; margin: 0 0 16px; }
  .page p { margin: 0 0 12px; white-space: pre-wrap; }
  .page p.q { padding-left: 14px; border-left: 2px solid rgba(90,60,20,.3); color: #4a3a22; }
  .page ol, .page ul { padding-left: 22px; margin: 0 0 12px; }
  .page li { margin: 0 0 4px; }
  .page .line { display: grid; grid-template-columns: 52px 1fr; gap: 10px; margin: 0 0 6px; }
  .page .line span:first-child { font-variant-numeric: tabular-nums; color: #7a5a30; font-size: 14px; padding-top: 2px; }
  .page .struck { text-decoration: line-through; color: #8a7a5a; }
  .page .empty { color: #8a7a5a; font-style: italic; }
  .page .standing { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; align-items: baseline; }
  .page .standing span:nth-child(2) { font-variant-numeric: tabular-nums; text-align: right; }
  .page .standing span:nth-child(3) { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #7a5a30; }

  .foot { padding: 0 26px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .live { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); }
  .live b { color: var(--success); }
  .live b.off { color: var(--text-3); }

  @media (max-width: 500px) { .head, .body { padding-left: 18px; padding-right: 18px; } .tabs { padding: 0 10px; } .tab { padding: 12px 8px 10px; font-size: 10px; } .page { margin: 16px; padding: 22px 20px 26px; } .foot { padding: 0 18px 18px; } h1 { font-size: 20px; } }
  @media (prefers-reduced-motion: reduce) { .panel, .page, .done { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <section class="panel" aria-label="leave an offering">
    <div class="head">
      <div class="eyebrow">the low door</div>
      <h1>leave him something</h1>
    </div>
    <div class="body">
      <div class="section" id="status">
        <div class="row"><span>right now</span><b id="s-time">--:--</b></div>
        <div class="row"><span>mood</span><b class="accent" id="s-mood">unknown</b></div>
        <div class="say" id="s-say">the door is shut.</div>
        <div class="hint" id="s-did"></div>
      </div>

      <form id="form" class="section" novalidate>
        <div>
          <label for="name">your name</label>
          <input id="name" name="name" maxlength="24" autocomplete="nickname" placeholder="who is this from" required>
        </div>
        <div>
          <label for="text">what you want to say</label>
          <textarea id="text" name="text" maxlength="200" placeholder="an intention. an order. a question. an insult. he reads all of it." required></textarea>
          <div class="count"><span id="count">0</span>/200</div>
        </div>
        <div class="err" id="err"></div>
        <button class="btn primary" id="send" type="submit">leave it by the door</button>
        <div class="hint">it appears by the door. he reads it when he decides to. nothing is sent back. if you want to know what he thought, read the book.</div>
      </form>
      <div class="done" id="done"></div>
    </div>
  </section>

  <section class="panel" aria-label="the book">
    <div class="head">
      <div class="eyebrow">his only memory</div>
      <h1>the book</h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" role="tab" data-tab="first">first page</button>
      <button class="tab" role="tab" data-tab="front">front</button>
      <button class="tab" role="tab" data-tab="middle">middle</button>
      <button class="tab" role="tab" data-tab="back">back</button>
    </div>
    <div class="page" id="page" role="tabpanel"></div>
    <div class="foot">
      <div class="live">book <b id="live" class="off">loading</b></div>
      <button class="btn ghost" id="refresh" type="button">read again</button>
    </div>
  </section>

</div>
<script>
// the visitor page. leave an offering, read the book. nothing is sent back.

const $ = (id) => document.getElementById(id);

// ---------- status ----------
function showState(st) {
  $('s-time').textContent = st.time || '--:--';
  $('s-mood').textContent = st.asleep ? 'asleep' : st.mood || 'unknown';
  $('s-say').textContent = st.asleep ? 'asleep. the book is being rewritten.' : st.say || st.event || 'the door is shut.';
  $('s-did').textContent = st.asleep ? '' : st.event && st.say ? st.event : '';
}

async function loadState() {
  try {
    const r = await fetch('/state');
    if (!r.ok) throw new Error();
    showState(await r.json());
    try {
      const es = new EventSource('/events');
      es.onmessage = (e) => showState(JSON.parse(e.data));
    } catch {}
  } catch {
    showState(DEMO.state);
  }
}

// ---------- the form ----------
const name = $('name');
const text = $('text');
text.addEventListener('input', () => ($('count').textContent = text.value.length));
name.addEventListener('input', () => $('err').classList.remove('on'));
text.addEventListener('input', () => $('err').classList.remove('on'));

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const n = name.value.trim();
  const t = text.value.trim();
  const err = $('err');
  if (!n || !t) {
    err.textContent = !n ? 'he will want to know who it is from.' : 'the thing by the door needs words on it.';
    err.classList.add('on');
    (!n ? name : text).focus();
    return;
  }
  $('send').disabled = true;
  try {
    const r = await fetch('/offer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: n, text: t }) });
    if (!r.ok) throw new Error(await r.text());
    done(`left it by the door. he will get to it, ${n}. read the back of the book later to see where you stand.`);
    text.value = '';
    $('count').textContent = '0';
  } catch (ex) {
    if (window.DEMO_MODE) done(`this is the demo, so nothing reached the door. on the real shop it would be sitting there now, ${n}.`);
    else {
      err.textContent = 'could not reach the door. is the room running?';
      err.classList.add('on');
    }
  }
  $('send').disabled = false;
});

function done(msg) {
  const d = $('done');
  d.textContent = msg;
  d.classList.add('on');
  setTimeout(() => d.classList.remove('on'), 9000);
}

// ---------- the book ----------
let book = null;
let tab = 'first';

async function loadBook() {
  try {
    const r = await fetch('/book');
    if (!r.ok) throw new Error();
    book = parseBook(await r.text());
    $('live').textContent = 'live';
    $('live').classList.remove('off');
  } catch {
    book = parseBook(DEMO.book);
    window.DEMO_MODE = true;
    $('live').textContent = 'demo';
  }
  render();
}

function parseBook(txt) {
  const [first = '', front = '', middle = '', back = ''] = txt.split(/\n---\n/);
  return { first, front, middle, back };
}

function esc(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function render() {
  const p = $('page');
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  if (!book) return;
  let html = '';
  if (tab === 'first') {
    html = '<h2>the first page. he cannot rewrite this one.</h2>';
    for (const line of book.first.split('\n')) {
      if (!line.trim()) continue;
      if (/^\d+\. /.test(line)) html += `<p>${esc(line)}</p>`;
      else if (line.startsWith('- ')) html += `<p>&nbsp;&nbsp;${esc(line)}</p>`;
      else html += `<p>${esc(line)}</p>`;
    }
  } else if (tab === 'front') {
    html = '<h2>front. spells. twelve at most.</h2>';
    const items = book.front.split('\n').filter((l) => l.startsWith('- '));
    if (!items.length) html += '<p class="empty">nothing written here yet.</p>';
    html += '<ul>' + items.map((l) => `<li class="${/^- ~~/.test(l) ? 'struck' : ''}">${esc(l.slice(2).replace(/~~/g, ''))}</li>`).join('') + '</ul>';
  } else if (tab === 'middle') {
    html = '<h2>middle. what happened. rewritten every time he sleeps.</h2>';
    const lines = book.middle.split('\n').filter((l) => l.trim() && !l.startsWith('#'));
    if (!lines.length) html += '<p class="empty">nothing has happened yet, or he has not written it down.</p>';
    for (const l of lines) {
      if (l.startsWith('> ')) html += `<p class="q">${esc(l.slice(2))}</p>`;
      else {
        const m = /^(\d\d:\d\d)\s+(.*)$/.exec(l);
        if (m) html += `<div class="line"><span>${m[1]}</span><span>${esc(m[2])}</span></div>`;
        else html += `<p>${esc(l)}</p>`;
      }
    }
  } else if (tab === 'back') {
    html = '<h2>back. money and people.</h2>';
    const money = /## money\n([^\n]*)/.exec(book.back)?.[1] || '';
    html += `<p>${esc(money)}</p>`;
    const people = [...book.back.matchAll(/^- (.+?): (\d+)$/gm)].map((m) => [m[1], Number(m[2])]);
    html += '<h2 style="margin-top:22px">people</h2>';
    if (!people.length) html += '<p class="empty">nobody yet.</p>';
    else {
      people.sort((a, b) => b[1] - a[1]);
      html += '<div class="standing">' + people.map(([n, s]) => `<span>${esc(n)}</span><span>${s}</span><span>${rank(s)}</span>`).join('') + '</div>';
    }
  }
  p.innerHTML = html;
}

function rank(n) {
  if (n >= 10) return 'one of his';
  if (n >= 3) return 'a regular';
  if (n >= 1) return 'someone';
  return 'a stranger';
}

document.querySelectorAll('.tab').forEach((b) =>
  b.addEventListener('click', () => {
    tab = b.dataset.tab;
    render();
  })
);
$('refresh').addEventListener('click', loadBook);

// ---------- demo data, used when there is no server behind the page ----------
const DEMO = {
  state: { time: '23:12', mood: 'bleak', say: 'two jars. the book did not say anything about jars.', event: 'cast the rosemary spell. it failed. a jar broke. 2 jars left' },
  book: [
    `this book is mine. the shop is mine. the door is shut and i do not know why.

rules i have worked out so far

1. candles cost money. money comes from the jars. the jars come from the herbs. the herbs come from somewhere i have not been.
2. spells go in the front. money goes in the back. what happened goes in the middle. do not mix them up again.
3. things left at the door are for me. read them. not all of them are kind. not all of them are wrong.
4. the mirror is not a spell.
5. when the pages run out, that is the end of the book. so write small.

names i would know anywhere

(none yet)`,
    `# front: spells

- the door spell. needs a key. i do not have a key. tried: never.
- a spell for keeping candles lit longer. it is mostly "do not breathe on them". tried: once. worked, probably.
- the rosemary spell. for finding things. tried: twice. found the floor.`,
    `# middle: what happened

> 2026-11-01. till 9. 3 things broke. the book did not warn me. the door is still shut.
> 2026-11-02. till 13. something worked. i am not saying what in case it hears. tio asked about the door. i did not answer. i wrote it down instead.

22:18  cast the rosemary spell. it failed. a jar broke. 4 jars left. said the words. waited.
22:19  checked the mirror
22:20  the door spell is a rosemary spell. i did not know that. now the rosemary is on the floor.
22:44  ate a jar of stock. 3 jars left. dinner was stock. the ledger will not like that but the ledger is not hungry.
22:52  seven. one jar. a door that wants a key. i am going to sleep on this and the book, in that order.`,
    `# back: money and people

## money
the till said 13 last time i looked

## people
- tio: 4
- garrett: 1`,
  ].join('\n---\n'),
};

loadState();
loadBook();

</script>
</body>
</html>
