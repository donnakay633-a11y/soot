<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the low door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-accent: #e0a040;
    --accent-glow: rgba(224,160,64,.30);
    --accent-dim: rgba(224,160,64,.12);
    --bg-outer: rgba(10,10,12,.86);
    --text-1: #f1ece0;
    --text-2: #b8b0a0;
    --text-3: #7d7868;
    --line: rgba(255,255,255,.10);
    --line-soft: rgba(255,255,255,.06);
    --radius-panel: 14px;
    --ease-out: cubic-bezier(0.22,1,0.36,1);
  }
  html, body { margin: 0; height: 100%; background: #0b0d0a; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: var(--text-1); }
  html { font-size: calc(100vh / 108); }
  canvas { display: block; }

  .plate {
    position: fixed; left: 2.4rem; bottom: 2.4rem; width: 34rem; max-width: calc(100vw - 4.8rem);
    background: var(--bg-outer); border: 1px solid var(--line); border-radius: var(--radius-panel);
    padding: 1.6rem 1.9rem 1.7rem; box-shadow: 0 1.2rem 3rem rgba(0,0,0,.6), 0 0 2.4rem var(--accent-dim);
    opacity: 0; transform: translateY(1.2rem) scale(.985);
    transition: opacity .2s var(--ease-out), transform .2s var(--ease-out);
  }
  .plate.on { opacity: 1; transform: none; }
  .plate::before, .plate::after {
    content: ''; position: absolute; width: 2.2rem; height: 2.2rem; border-color: var(--panel-accent); border-style: solid;
  }
  .plate::before { top: .6rem; left: .6rem; border-width: 2px 0 0 2px; }
  .plate::after { bottom: .6rem; right: .6rem; border-width: 0 2px 2px 0; }

  .eyebrow { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: .22em; text-transform: uppercase; color: var(--panel-accent); display: flex; justify-content: space-between; }
  .eyebrow span:last-child { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .mood { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: .06em; text-transform: uppercase; margin-top: .5rem; }
  .say { font-size: 1.7rem; font-weight: 600; line-height: 1.35; margin-top: .9rem; min-height: 2.3rem; color: var(--text-1); }
  .did { font-size: 1.3rem; font-weight: 500; letter-spacing: .02em; color: var(--text-3); margin-top: .35rem; }

  .needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1.3rem; padding-top: 1.1rem; border-top: 1px solid var(--line-soft); }
  .need label { display: block; font-size: 1.05rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
  .need .val { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.5rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; margin-top: .2rem; }
  .need .bar { height: .4rem; background: var(--line-soft); border-radius: .2rem; margin-top: .45rem; overflow: hidden; }
  .need .bar i { display: block; height: 100%; width: 0; background: var(--panel-accent); transition: width .4s var(--ease-out); }
  .need.warn .bar i { background: #c9553d; }

  .diary { position: fixed; right: 2.4rem; bottom: 2.4rem; width: 30rem; max-width: calc(100vw - 4.8rem); font-size: 1.25rem; font-weight: 500; color: var(--text-3); line-height: 1.5; text-align: right; pointer-events: none; }
  .diary div { opacity: .55; }
  .diary div:last-child { opacity: 1; color: var(--text-2); }

  .corner { position: fixed; top: 2rem; left: 2.4rem; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); }
  .corner b { color: var(--panel-accent); font-weight: 700; }

  @media (max-width: 700px) { .diary { display: none; } .plate { width: auto; right: 2.4rem; } }
</style>
</head>
<body>
<div class="corner"><b>soot</b> &nbsp;·&nbsp; the low door &nbsp;·&nbsp; <span id="brain">connecting</span></div>

<div class="plate" id="plate">
  <div class="eyebrow"><span id="moon">moon</span><span id="time">00:00</span></div>
  <div class="mood" id="mood">content</div>
  <div class="say" id="say"></div>
  <div class="did" id="did"></div>
  <div class="needs">
    <div class="need" id="n-hunger"><label>hunger</label><div class="val">0</div><div class="bar"><i></i></div></div>
    <div class="need" id="n-sleep"><label>sleep</label><div class="val">0</div><div class="bar"><i></i></div></div>
    <div class="need" id="n-purpose"><label>purpose</label><div class="val">0</div><div class="bar"><i></i></div></div>
  </div>
</div>

<div class="diary" id="diary"></div>

<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js" } }
</script>
<script type="module" src="/room.js"></script>
</body>
</html>
